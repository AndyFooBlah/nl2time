# Repo-specific toolchain for deps-fixer.yml (dependency program,
# AndyFooBlah/andy-private-docs#57). Mirrors the setup steps in ci.yml:
# Node (CI tests 22 and 24) for the JS package, uv + Python (CI tests
# 3.11-3.14) for python/.
name: deps-toolchain
description: Install the toolchain CI uses
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: npm
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        python-version: "3.13"
