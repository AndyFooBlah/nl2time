# Standard Dependabot config, generated for the dependency security program
# (AndyFooBlah/andy-private-docs#57; policy in andy-private-docs deps/POLICY.md).
# Security updates ignore the schedule, the cooldown and the PR limit: they open
# as soon as GitHub publishes an advisory with a fix.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
      semver-major-days: 14
    groups:
      routine:
        applies-to: version-updates
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: "/python"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
      semver-major-days: 14
    groups:
      routine:
        applies-to: version-updates
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
    groups:
      routine:
        applies-to: version-updates
        update-types: [minor, patch]
